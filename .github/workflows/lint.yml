name: lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@main
        continue-on-error: true
        with:
          globs: "**/*.md"
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@master
        continue-on-error: true
        with:
          file_or_dir: .github/workflows
          config_data: "{extends: relaxed, rules: {line-length: disable}}"
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: crazy-max/ghaction-dump-context@master
        continue-on-error: true
  node:
    runs-on: ubuntu-latest
    container: node:latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version
