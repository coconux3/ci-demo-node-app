name: lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  super-linter:
    runs-on: ubuntu-latest
    container: node:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: super-linter/super-linter@0209c200ae860f13235e78f50a36ed21c198ba4f # main
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: main
    permissions:
      contents: read
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ibiqlik/action-yamllint@b74a2626a991d676b6ec243a6458ff86cccf2d2d # master
        with:
          file_or_dir: .github/workflows
    permissions:
      contents: read
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@a738a19d9832d3b83d526397ce5ac9cfc7a8bbc4 # main
        with:
          globs: "**/*.md"
    permissions:
      contents: read
  eslint:
    runs-on: ubuntu-latest
    container: node:current
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: wearerequired/lint-action@548d8a7c4b04d3553d32ed5b6e91eb171e10e7bb # v2
        with:
          eslint: false
    permissions:
      contents: read
